<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | PeoplePulse</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", sans-serif; background: #eef3f7; color: #17212b; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
    main { width: min(100%, 420px); padding: 32px; background: #fff; border: 1px solid #d7e0e8; border-radius: 12px; box-shadow: 0 16px 40px rgba(23, 33, 43, .1); }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #52606d; line-height: 1.5; }
    label { display: block; margin: 20px 0 7px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #b8c5d1; border-radius: 7px; font-size: 16px; }
    button { width: 100%; margin-top: 24px; padding: 13px; border: 0; border-radius: 7px; background: #1769aa; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #message { margin-top: 16px; font-weight: 600; }
    .error { color: #b42318; } .success { color: #067647; }
  </style>
</head>
<body>
  <main>
    <h1>Choose a new password</h1>
    <p>This link is single-use and expires after 30 minutes.</p>
    <form id="reset-form">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required>
      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required>
      <button id="submit" type="submit">Reset password</button>
    </form>
    <div id="message" role="status"></div>
  </main>
  <script src="/reset-password.js" defer></script>
</body>
</html>
